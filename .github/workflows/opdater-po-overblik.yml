name: Opdater PO-overblik

on:
  workflow_dispatch:
  schedule:
    # Kører hver morgen. Cron er UTC:
    # 06:15 UTC = 08:15 dansk sommertid / 07:15 dansk vintertid.
    - cron: "15 6 * * *"

permissions:
  contents: write

concurrency:
  group: po-overblik
  cancel-in-progress: true

jobs:
  opdater:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Generer PO-overblik
        shell: pwsh
        env:
          # Bruges til læsning af organisations-Project og issues.
          GH_TOKEN: ${{ secrets.OS2SOFD_PROJECT_TOKEN }}
        run: |
          ./scripts/po-overblik/generer-po-overblik.ps1 `
            -OutputPath "docs/po-overblik.md"

      - name: Commit opdateret overblik
        shell: bash
        run: |
          if git diff --quiet -- docs/po-overblik.md; then
            echo "Ingen ændringer i PO-overblikket."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/po-overblik.md
          git commit -m "chore: opdater PO-overblik"
          git push

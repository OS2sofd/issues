name: Notificer Klar til prioritering

on:
  workflow_dispatch:
  schedule:
    # Højeste understøttede frekvens i GitHub Actions er i praksis minutbaseret,
    # men vi bruger én gang i timen som passende kontrol for denne proces.
    - cron: "5 * * * *"

permissions:
  contents: write
  issues: write

concurrency:
  group: notifikation-klar-til-bestilling
  cancel-in-progress: false

jobs:
  notificer:
    runs-on: ubuntu-latest

    steps:
      - name: Hent repository
        uses: actions/checkout@v4

      - name: Kontroller status og send notifikation
        shell: pwsh
        env:
          # PAT med adgang til org Project:
          GH_TOKEN: ${{ secrets.OS2SOFD_PROJECT_TOKEN }}

          # Repoets GITHUB_TOKEN bruges kun til at skrive issue-kommentarer:
          REPO_TOKEN: ${{ github.token }}
        run: |
          ./scripts/notifikation/notifikation-klar-til-bestilling.ps1 `
            -StatePath "data/notifikation-klar-til-bestilling.json"

      - name: Commit opdateret state
        shell: bash
        run: |
          if [ -z "$(git status --porcelain -- data/notifikation-klar-til-bestilling.json)" ]; then
            echo "Ingen ændring i state."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/notifikation-klar-til-bestilling.json
          git commit -m "chore: opdater notifikationsstatus"
          git push
